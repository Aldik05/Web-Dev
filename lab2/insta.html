<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="insta.css">
</head>
<body>
    <div id="main-page">
        <div id="left-side">
            <img src="images/phone.png" alt="phone" class="phone-some">
            <img src="images/someGif.gif" alt="gif" class="gif-some">
        </div>

        <div id="right-side">
            <div class="some-border">
                <div class="img-logo">
                    <img src="images/pngInst.png" alt="Instagram Logo" id="logo">
                </div>

                <form action="" method="post" class="login">
                    <input type="text" placeholder="Телефон, имя пользователя или эл. адрес" class="input-group" autocomplete="off">
                    <input type="password" placeholder="Пароль" class="input-group" autocomplete="off">
                    <button type="submit" class="join-button"><strong class="qwerty">Войти</strong></button>
                </form>

                <div class="or">
                    <div class="line"></div>
                    <span>ИЛИ</span>
                    <div class="line"></div>
                </div>

                <div class="facebook">
                    <img src="images/facebook-logo.png" alt="Facebook Logo" id="facebook-logo">
                    <a href="https://www.facebook.com/login" class="link-settings">Войти через Facebook</a>
                </div>

                <div class="forgot">
                    <a href="https://www.instagram.com/accounts/password/reset/" class="forgot-link">Забыли пароль?</a>
                </div>
            </div>

            <div class="some-border">
                <div class="create">
                    <div>У вас еще нет аккаунта?</div>
                    <a href="#" class="link-settings set-the-font"><strong>Зарегистрироваться</strong></a>
                </div>
            </div>

            <div class="download-app">
                <p>Установите приложение.</p>
            </div>

            <div class="apps">
                <img src="images/down-apple.png" alt="Скачать в App Store" class="app-icon">
                <img src="images/down-google.png" alt="Скачать в Google Play" class="app-icon">
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-1">
            <a href="#" class="href-1">Meta</a>
            <a href="#" class="href-1">Информация</a>
            <a href="#" class="href-1">Блог</a>
            <a href="#" class="href-1">Вакансии</a>
            <a href="#" class="href-1">Помощь</a>
            <a href="#" class="href-1">API</a>
            <a href="#" class="href-1">Конфиденциальность</a>
            <a href="#" class="href-1">Условия</a>
            <a href="#" class="href-1">Места</a>
            <a href="#" class="href-1">Instagram Lite</a>
            <a href="#" class="href-1">Threads</a>
            <a href="#" class="href-1">Загрузка контактов</a>
            <a href="#" class="href-1">Meta Verified</a>
        </div>

        <div class="footer-2">
            <a href="#" class="href-1">Русский</a>
            <span>© 2024 Instagram from Meta</span>
        </div>
    </footer>
</body>
</html>
